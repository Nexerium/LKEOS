name: Публикация для Windows

on:
  push:
    branches: [main]
    paths: [KalugaCampus.csproj]

permissions:
  contents: read

jobs:
  release:
    if: github.event.head_commit.message == 'Release v1.0'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Собрать приложение и архив исходников
        shell: pwsh
        run: |
          dotnet publish KalugaCampus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish/KalugaCampus.exe LKEOS-1.0-win-x64.exe
          if ((Get-Item LKEOS-1.0-win-x64.exe).VersionInfo.ProductVersion.Split('+')[0] -ne '1.0.0') { throw 'Неверная версия приложения' }
          git archive --format=zip -o LKEOS-1.0-source.zip HEAD
      - name: Создать релиз 1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0 LKEOS-1.0-win-x64.exe LKEOS-1.0-source.zip --target "$env:GITHUB_SHA" --title "ЛКЭОС 1.0 для Windows" --notes-file docs/releases/1.0.md --latest
